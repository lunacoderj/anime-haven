<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>AnimeWorldData - Discover, Track & Explore Top Anime & Manga Database</title>
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7519594157430444" crossorigin="anonymous"></script>
    
    <!-- Primary SEO Meta Tags -->
    <meta name="title" content="AnimeWorldData - Discover, Track & Explore Top Anime & Manga Database" />
    <meta name="description" content="AnimeWorldData is your ultimate destination for anime and manga discovery. Track upcoming episodes, explore trending seasonal anime, read manga, and get smart AI-powered recommendations." />
    <meta name="keywords" content="anime streaming, manga reader, best anime database, watch anime online, top anime 2026, anime schedule, popular manga recommendations, character explorer, anime world data, MyAnimeList alternative, AniList tracker" />
    <meta name="author" content="AnimeWorldData" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://animeworlddata.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://animeworlddata.com/" />
    <meta property="og:title" content="AnimeWorldData - Discover Your Next Favorite Anime" />
    <meta property="og:description" content="Track, chat, and explore top anime and manga with AI-powered discovery." />
    <meta property="og:image" content="https://animeworlddata.com/favicon.png" />
    <meta property="og:site_name" content="AnimeWorldData" />

    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://animeworlddata.com/" />
    <meta property="twitter:title" content="AnimeWorldData | Anime Discovery Hub" />
    <meta property="twitter:description" content="Smart AI recommendations and community tracking for anime and manga fans." />

    <!-- Schema.org JSON-LD WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AnimeWorldData",
      "url": "https://animeworlddata.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://animeworlddata.com/anime?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
